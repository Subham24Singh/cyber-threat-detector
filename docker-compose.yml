version: '3.8'

services:
  # The Python Backend
  backend:
    build: ./backend
    container_name: threat-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  # The React Frontend
  frontend:
    build: ./frontend
    container_name: threat-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend